name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Newer pushes cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Live Supabase suites self-skip without RUN_LIVE_SUPABASE_TESTS + credentials,
      # so the offline suite runs here with no secrets required.
      - name: Test
        run: npm test

      # Pages are force-dynamic (evaluated per request, not at build), so placeholder
      # public env is enough to satisfy the Supabase client constructors during build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
